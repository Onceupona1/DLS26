<script>
    async function checkLogin() {
        // TEST 1: If you see this alert, the button works!
        alert("Button clicked! Starting verification...");

        const btn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const refInput = document.getElementById('ref-input').value.trim();

        if (!refInput) {
            alert("Error: You didn't type anything!");
            showError("Please enter your reference ID.");
            return;
        }

        // UPDATE THIS URL with your new deployment link
        const SCRIPT_URL = "YOUR_NEW_DEPLOY_URL_HERE";

        try {
            console.log("Fetching from:", SCRIPT_URL);
            const response = await fetch(SCRIPT_URL);
            
            // TEST 2: Check if Google sent data back
            if (!response.ok) throw new Error("Google Script refused the connection");
            
            const players = await response.json();
            console.log("Players found:", players);

            // Searching... we use .toString().trim() to be 100% sure
            const player = players.find(row => 
                row[2] && row[2].toString().trim() === refInput
            );

            if (player) {
                alert("Success! Welcome " + player[0]);
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("playerName", player[0]);
                localStorage.setItem("playerRef", player[2]);
                localStorage.setItem("playerStatus", player[3]);
                window.location.href = "dashboard.html";
            } else {
                alert("Reference not found in the Google Sheet.");
                showError("Reference not found. Check your spelling.");
            }
        } catch (err) {
            alert("System Error: " + err.message);
            console.error(err);
        }
    }

    function showError(msg) {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.innerText = msg;
        errorMsg.classList.remove('hidden');
    }
</script>
