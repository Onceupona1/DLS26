<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Login | DLS Elite League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-6">

    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-600/10 blur-[100px] rounded-full"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-indigo-600/10 blur-[100px] rounded-full"></div>
    </div>

    <div class="glass glow w-full max-w-md p-8 rounded-3xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tighter">DLS<span class="text-blue-500">26</span> HUB</h1>
            <p class="text-slate-400 text-sm mt-2">Enter your Payment Reference to access the league</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase ml-1 mb-1">Paystack Reference</label>
                <input type="text" id="ref-input" placeholder="e.g. T738003..." 
                    class="w-full bg-slate-900/50 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500 transition-all text-white font-mono">
            </div>

            <button onclick="checkLogin()" id="login-btn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all active:scale-95 flex justify-center items-center">
                <span id="btn-text">Verify & Enter</span>
            </button>

            <p id="error-msg" class="text-red-400 text-xs text-center font-medium hidden"></p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
            <p class="text-slate-500 text-xs">Haven't registered yet?</p>
            <a href="index.html" class="text-blue-400 text-xs font-bold hover:underline">Return to Home</a>
        </div>
    </div>

    <script>
        async function checkLogin() {
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const errorMsg = document.getElementById('error-msg');
            const refInput = document.getElementById('ref-input').value.trim();

            if (!refInput) {
                showError("Please enter your reference ID.");
                return;
            }

            // UI Feedback
            btn.disabled = true;
            btnText.innerText = "Checking...";
            errorMsg.classList.add('hidden');

            // IMPORTANT: Replace this URL with your Google Apps Script Web App URL
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec
";

            try {
                const response = await fetch(SCRIPT_URL);
                const players = await response.json();
                
                // Search for the reference in the 3rd column (index 2) of your Google Sheet
                const player = players.find(row => row[2] === refInput);

                if (player) {
                    // Save player info to browser memory
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("playerName", player[0]);
                    localStorage.setItem("playerRef", player[2]);
                    localStorage.setItem("playerStatus", player[3]); // "Main League" or "Playoff"

                    window.location.href = "dashboard.html";
                } else {
                    showError("Reference not found. Make sure you paid correctly.");
                }
            } catch (err) {
                showError("Server error. Please check your internet connection.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btnText.innerText = "Verify & Enter";
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
