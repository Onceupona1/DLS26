<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DLS Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-xl w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center">Player Sign-In</h2>
        <p class="text-xs text-slate-400 mb-4 text-center">Enter the Reference ID from your Paystack Receipt</p>
        
        <input type="text" id="ref-input" placeholder="e.g. T123456789" class="w-full p-3 rounded bg-slate-700 border border-slate-600 mb-4 outline-none focus:border-green-500">
        
        <button onclick="checkLogin()" class="w-full bg-green-500 py-3 rounded font-bold hover:bg-green-600 transition">
            Access My Fixtures
        </button>
        
        <p id="error" class="text-red-500 text-xs mt-4 hidden text-center">Invalid Reference. Please pay first.</p>
    </div>

    <script>
        function checkLogin() {
            const ref = document.getElementById('ref-input').value.trim();
            // FOR NOW: We will manually add paid references here.
            // Later, we can automate this with Google Sheets.
            const paidUsers = ["REF123", "H83GP0TV", "TESTPLAY"]; 

            if (paidUsers.includes(ref)) {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('error').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
