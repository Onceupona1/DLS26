<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • DLS26 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .input-glass {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            background: rgba(30, 41, 59, 0.8);
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-[#0a0e27] text-slate-200 min-h-screen flex items-center justify-center px-4">
    <!-- Background Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute w-72 h-72 bg-blue-600 -top-32 -left-32 rounded-full blur-3xl opacity-20"></div>
        <div class="absolute w-96 h-96 bg-purple-600 -bottom-32 -right-32 rounded-full blur-3xl opacity-20"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <div class="glass rounded-3xl p-8 md:p-10 shadow-2xl">
            <!-- Header -->
            <div class="text-center mb-10">
                <h1 class="text-5xl font-black mb-2">
                    DLS<span class="text-blue-500">26</span>
                </h1>
                <div class="h-1 w-16 bg-gradient-to-r from-blue-500 to-purple-500 mx-auto rounded-full mb-6"></div>
                <p class="text-slate-400 text-sm">
                    Enter your <span class="text-blue-300 font-semibold">Paystack Transaction Reference</span><br>
                    to access your player dashboard
                </p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 ml-1">
                        Transaction Reference
                    </label>
                    <input
                        type="text"
                        id="refInput"
                        placeholder="e.g., T513408264963295"
                        class="w-full input-glass p-4 rounded-2xl text-white placeholder:text-slate-600 focus:outline-none"
                        autocomplete="off"
                        autocapitalize="characters"
                    />
                </div>

                <button
                    type="button"
                    id="loginBtn"
                    onclick="handleLogin()"
                    class="btn-primary w-full text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2"
                >
                    <span id="btnText">🔓 VERIFY & LOGIN</span>
                </button>

                <div id="errorMsg" class="hidden bg-red-900/30 border border-red-500/50 text-red-300 p-4 rounded-2xl text-sm font-medium"></div>
                <div id="successMsg" class="hidden bg-green-900/30 border border-green-500/50 text-green-300 p-4 rounded-2xl text-sm font-medium"></div>
            </form>

            <!-- Links -->
            <div class="mt-10 text-center text-xs text-slate-500 space-y-3">
                <p>
                    <a href="index.html" class="text-blue-400 hover:underline transition">← Back to Home</a>
                </p>
                <p>
                    Don't have a reference?
                    <a href="https://paystack.shop/pay/h83gp0tvg6" target="_blank" class="text-blue-400 hover:underline font-semibold">Register now</a>
                </p>
            </div>
        </div>

        <!-- Info Box -->
        <div class="glass rounded-2xl p-6 mt-6">
            <p class="text-xs text-slate-400 text-center">
                💡 Your Paystack reference is in your email receipt or account dashboard.
            </p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec";

        async function handleLogin() {
            const refInput = document.getElementById("refInput");
            const loginBtn = document.getElementById("loginBtn");
            const btnText = document.getElementById("btnText");
            const errorMsg = document.getElementById("errorMsg");
            const successMsg = document.getElementById("successMsg");

            const ref = refInput.value.trim().toUpperCase();
            refInput.value = ref;

            // Clear messages
            errorMsg.classList.add("hidden");
            successMsg.classList.add("hidden");

            // Validation
            if (!ref) {
                showError("Please enter your Paystack reference ID.");
                return;
            }

            if (!/^T[A-Z0-9]{10,20}$/.test(ref)) {
                showError("Invalid format. Paystack refs start with 'T' followed by 10-20 characters.");
                return;
            }

            // Loading state
            loginBtn.disabled = true;
            btnText.innerHTML = '<svg class="animate-spin h-5 w-5 inline mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8h8a8 8 0 01-16 0z"></path></svg> Verifying...';

            try {
                const res = await fetch(SCRIPT_URL + "?t=" + Date.now(), { cache: "no-store" });
                if (!res.ok) throw new Error(`Server error ${res.status}`);

                const data = await res.json();
                const standings = data.standings || [];

                if (standings.length === 0) {
                    showError("League database is empty. Please register first.");
                    return;
                }

                // Find player by reference
                const player = standings.find(row =>
                    row[2] && String(row[2]).trim().toUpperCase() === ref
                );

                if (player) {
                    // Store session
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("playerName", player[0] || "Player");
                    localStorage.setItem("playerRef", player[2]);
                    localStorage.setItem("playerEmail", player[1] || "");
                    localStorage.setItem("playerStatus", player[3] || "Active");

                    showSuccess("✅ Access Granted! Redirecting...");
                    btnText.innerText = "✅ LOGGED IN";
                    loginBtn.classList.add("bg-green-600");

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    showError("Reference not found. Double-check or register first.");
                }
            } catch (err) {
                console.error("Login error:", err);
                showError("Connection error. Check your internet and try again.");
            } finally {
                if (!btnText.innerText.includes("✅")) {
                    loginBtn.disabled = false;
                    btnText.innerText = "🔓 VERIFY & LOGIN";
                }
            }
        }

        function showError(msg) {
            const el = document.getElementById("errorMsg");
            el.textContent = "❌ " + msg;
            el.classList.remove("hidden");
        }

        function showSuccess(msg) {
            const el = document.getElementById("successMsg");
            el.textContent = msg;
            el.classList.remove("hidden");
        }

        // Clear error on input
        document.getElementById("refInput").addEventListener("input", () => {
            document.getElementById("errorMsg").classList.add("hidden");
        });

        // Auto focus
        document.getElementById("refInput").focus();

        // Check if already logged in
        if (localStorage.getItem("isLoggedIn") === "true") {
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
