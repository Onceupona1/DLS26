```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLS League Portal</title>

<style>
:root {
  --bg: #050a18;
  --card: #0a122a;
  --accent: #3b82f6;
  --text: #ffffff;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background: #0a122a;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: var(--accent);
  font-weight: bold;
  font-size: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

h2 {
  margin-top: 0;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

input {
  background: #111827;
  color: white;
}

button {
  background: var(--accent);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  opacity: 0.9;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2937;
}

th {
  color: #9ca3af;
  text-align: left;
}

tr:hover {
  background: rgba(255,255,255,0.05);
}

.badge {
  background: var(--accent);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}

.top {
  color: #22c55e;
  font-weight: bold;
}

</style>
</head>

<body>

<header>
  <div class="logo">DLS League Portal</div>
</header>

<!-- AUTH -->
<div class="container" id="auth">

  <div class="card">
    <h2>Join League</h2>
    <p>Register and pay to join the competition</p>
    <a href="https://paystack.shop/pay/h83gp0tvg6" target="_blank">
      <button>Register & Pay</button>
    </a>
  </div>

  <div class="card">
    <h2>Login</h2>
    <input id="ref" placeholder="Enter Paystack Reference ID">
    <button onclick="login()">Login</button>
  </div>

</div>

<!-- DASHBOARD -->
<div class="container" id="dashboard" style="display:none;">

  <div class="card">
    <h2>League Standings</h2>
    <table id="table"></table>
  </div>

  <div class="card">
    <h2>Submit Match Result</h2>

    <input id="home" placeholder="Home Player">
    <input id="away" placeholder="Away Player">
    <input id="hs" type="number" placeholder="Home Score">
    <input id="as" type="number" placeholder="Away Score">
    <input id="img" type="file">

    <button onclick="submitScore()">Submit Result</button>
  </div>

</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_SCRIPT_URL_HERE";

/* LOGIN */
async function login() {
  const ref = document.getElementById("ref").value;

  const res = await fetch(`${SCRIPT_URL}?action=getUsers`);
  const users = await res.json();

  const user = users.find(u => u.Reference_ID == ref);

  if (!user) {
    alert("Invalid Reference ID");
    return;
  }

  localStorage.setItem("user", JSON.stringify(user));
  loadDashboard();
}

/* LOAD DASHBOARD */
function loadDashboard() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadStandings();
}

/* STANDINGS */
async function loadStandings() {
  const res = await fetch(`${SCRIPT_URL}?action=getStandings`);
  const data = await res.json();

  const sorted = Object.entries(data)
    .map(([name, stats]) => ({ name, ...stats }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd);

  let html = `
    <tr>
      <th>#</th>
      <th>Player</th>
      <th>PTS</th>
      <th>GD</th>
    </tr>
  `;

  sorted.forEach((p, i) => {
    html += `
      <tr>
        <td>${i + 1}</td>
        <td class="${i === 0 ? 'top' : ''}">${p.name}</td>
        <td>${p.pts}</td>
        <td>${p.gd}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = html;
}

/* SUBMIT SCORE */
async function submitScore() {
  const file = document.getElementById("img").files[0];
  if (!file) return alert("Upload screenshot");

  const base64 = await toBase64(file);

  const payload = {
    action: "submitScore",
    home: document.getElementById("home").value,
    away: document.getElementById("away").value,
    homeScore: document.getElementById("hs").value,
    awayScore: document.getElementById("as").value,
    screenshot: base64
  };

  await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  });

  alert("Submitted for approval");
}

/* IMAGE TO BASE64 */
function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
  });
}

/* AUTO LOGIN */
if (localStorage.getItem("user")) {
  loadDashboard();
}
</script>

</body>
</html>
