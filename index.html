<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 PRO • Elite Dream League Soccer League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(15,23,42,0.85); backdrop-filter: blur(16px); }
        .hero { background: linear-gradient(135deg, #1e3a8a, #0f172a); }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen">
    <nav class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <h1 class="text-3xl font-black tracking-tighter">DLS<span class="text-blue-500">26</span><span class="text-xs align-super ml-1 text-green-400">PRO</span></h1>
        <a href="login.html" class="bg-blue-600 hover:bg-blue-500 px-7 py-3 rounded-full font-bold shadow-lg shadow-blue-600/30 transition">PLAYER LOGIN</a>
    </nav>

    <main class="hero pt-16 pb-20 text-center">
        <h1 class="text-6xl md:text-7xl font-black leading-none mb-4">THE ULTIMATE<br>DLS 26 PRO LEAGUE</h1>
        <p class="text-xl text-slate-400 mb-8">EPL-style competition • Auto fixtures • Real results • Admin verified</p>
        
        <a href="https://paystack.shop/pay/h83gp0tvg6" 
           onclick="localStorage.setItem('justPaid', 'true');"
           class="inline-block bg-white text-black font-black text-xl px-10 py-5 rounded-3xl hover:scale-105 transition shadow-2xl">
            REGISTER NOW • ₵ Payment Secured
        </a>
        
        <p class="text-xs text-slate-500 mt-6">After payment you will be redirected back here → then login with your reference</p>
    </main>

    <!-- Live Standings -->
    <div class="max-w-5xl mx-auto px-6 pb-20">
        <div class="glass border border-slate-700 rounded-3xl p-6 shadow-2xl">
            <h2 class="text-2xl font-bold flex justify-between">🌍 LIVE STANDINGS <span class="text-green-400 text-sm animate-pulse">● AUTO UPDATES</span></h2>
            <table class="w-full mt-4 text-sm">
                <thead class="text-xs text-slate-400 border-b border-slate-700">
                    <tr><th class="py-3">POS</th><th>PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th class="text-blue-400">PTS</th></tr>
                </thead>
                <tbody id="standings-body" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        const URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec";
        async function load() {
            const res = await fetch(URL + '?t=' + Date.now());
            const j = await res.json();
            document.getElementById('standings-body').innerHTML = j.standings.map((r,i) => `
                <tr class="hover:bg-slate-800/50">
                    <td class="py-4">${i+1}</td>
                    <td class="font-bold">${r[0]}</td>
                    <td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td>
                    <td class="font-black text-blue-400">${r[9]}</td>
                </tr>
            `).join('');
            
            // Success banner from Paystack redirect
            if (location.search.includes('success') || localStorage.getItem('justPaid')) {
                document.body.insertAdjacentHTML('afterbegin', 
                    `<div class="fixed top-4 left-1/2 -translate-x-1/2 bg-green-600 text-white px-8 py-3 rounded-2xl shadow-xl flex items-center gap-3 z-50">
                        ✅ Payment Received! Use your Paystack Reference to login below ↓
                        <button onclick="this.parentElement.remove()" class="underline">Close</button>
                    </div>`);
                localStorage.removeItem('justPaid');
            }
        }
        window.onload = load;
    </script>
</body>
</html>
