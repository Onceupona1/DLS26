<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLS League Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050a18;
      color: white;
    }
    header {
      padding: 15px 30px;
      background: #0a122a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #3b82f6;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: #0a122a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
    }
    input {
      background: #111827;
      color: white;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #1f2937;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">DLS League</div>
</header>

<div class="container" id="auth">
  <div class="card">
    <h2>Register</h2>
    <p>Click below to pay and join the league</p>
    <a href="https://paystack.shop/pay/h83gp0tvg6" target="_blank">
      <button>Register & Pay</button>
    </a>
  </div>

  <div class="card">
    <h2>Login</h2>
    <input type="text" id="ref" placeholder="Enter Reference ID">
    <button onclick="login()">Login</button>
  </div>
</div>

<div class="container" id="dashboard" style="display:none;">
  <div class="card">
    <h2>Standings</h2>
    <table id="table"></table>
  </div>

  <div class="card">
    <h2>Submit Score</h2>
    <input type="text" id="home" placeholder="Home Player">
    <input type="text" id="away" placeholder="Away Player">
    <input type="number" id="hs" placeholder="Home Score">
    <input type="number" id="as" placeholder="Away Score">
    <input type="file" id="img">
    <button onclick="submitScore()">Submit</button>
  </div>
</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_SCRIPT_URL_HERE";

async function login() {
  const ref = document.getElementById("ref").value;

  const res = await fetch(`${SCRIPT_URL}?action=getUsers`);
  const users = await res.json();

  const user = users.find(u => u.Reference_ID == ref);

  if (user) {
    localStorage.setItem("user", JSON.stringify(user));
    showDashboard();
  } else {
    alert("Invalid Reference ID");
  }
}

function showDashboard() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  loadStandings();
}

async function loadStandings() {
  const res = await fetch(`${SCRIPT_URL}?action=getStandings`);
  const data = await res.json();

  const sorted = Object.entries(data)
    .map(([name, stats]) => ({ name, ...stats }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd);

  let html = `<tr><th>#</th><th>Player</th><th>PTS</th><th>GD</th></tr>`;

  sorted.forEach((p, i) => {
    html += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.pts}</td><td>${p.gd}</td></tr>`;
  });

  document.getElementById("table").innerHTML = html;
}

async function submitScore() {
  const file = document.getElementById("img").files[0];
  const base64 = await toBase64(file);

  const data = {
    action: "submitScore",
    home: document.getElementById("home").value,
    away: document.getElementById("away").value,
    homeScore: document.getElementById("hs").value,
    awayScore: document.getElementById("as").value,
    screenshot: base64
  };

  await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(data)
  });

  alert("Submitted for review");
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

// Auto login
if (localStorage.getItem("user")) {
  showDashboard();
}
</script>

</body>
</html>
