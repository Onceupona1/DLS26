<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin • DLS26 PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0e27; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(15,23,42,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(59,130,246,0.2); }
    #adminPanel { display:none; }
    #toast { position:fixed; bottom:24px; right:24px; z-index:9999; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; transform:translateY(80px); opacity:0; transition:all 0.3s ease; }
    #toast.show { transform:translateY(0); opacity:1; }
    #toast.success { background:rgba(16,185,129,0.2); border:1px solid rgba(16,185,129,0.4); color:#6ee7b7; }
    #toast.error { background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="flex items-center justify-center min-h-screen">
  <div class="glass rounded-2xl p-10 max-w-sm text-center">
    <div class="text-4xl mb-4">🔐</div>
    <h2 class="text-xl font-black mb-2">Admin Login</h2>
    <input id="adminPassword" type="password" placeholder="Enter password" 
           class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg mb-4 text-sm"/>
    <button onclick="checkPassword()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold text-white transition">Login</button>
    <p id="loginError" class="text-red-400 text-xs mt-2 hidden">Incorrect password</p>
  </div>
</div>

<!-- MAIN ADMIN PANEL -->
<div id="adminPanel">
  <!-- your full admin panel here (header, tabs, tables) -->
  <!-- same as your original code -->
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  const ADMIN_PASSWORD = "supersecure123"; // <-- set your admin password here

  function checkPassword() {
    const entered = document.getElementById("adminPassword").value;
    if (entered === ADMIN_PASSWORD) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      showToast("Login successful", "success");

      // Load all your admin data
      loadAll();
    } else {
      document.getElementById("loginError").classList.remove("hidden");
      showToast("Incorrect password", "error");
    }
  }

  function showToast(msg, type="success") {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.className = "show " + type;
    setTimeout(() => { t.className = type; }, 3000);
  }

  // ========================
  // YOUR EXISTING DATA FUNCTIONS (loadAll, loadPlayers, loadStandings, etc.)
  // ========================
</script>

</body>
</html>
