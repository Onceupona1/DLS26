<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DLS26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>if(localStorage.getItem("isLoggedIn")!=="true") window.location.href="login.html";</script>
</head>
<body class="bg-[#020617] text-slate-300 min-h-screen p-6">
    <main class="max-w-4xl mx-auto space-y-8">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-black text-white italic">DLS<span class="text-blue-500">26</span> DASH</h1>
            <button onclick="localStorage.clear(); location.href='index.html'" class="text-xs text-red-500 font-bold">LOGOUT</button>
        </div>

        <div class="bg-blue-600/10 p-6 rounded-3xl border border-blue-500/20">
            <p class="text-xs uppercase font-bold text-blue-400">Welcome</p>
            <p id="p-name" class="text-2xl font-black text-white"></p>
        </div>

        <section id="fixtures" class="space-y-3">
            <h2 class="font-bold text-white">Upcoming Fixtures</h2>
            <div id="fix-list" class="grid gap-2 text-sm"></div>
        </section>

        <section class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800">
            <h2 class="font-bold text-white mb-4">League Standings</h2>
            <table class="w-full text-left text-sm">
                <tbody id="table-body"></tbody>
            </table>
        </section>
    </main>

    <script>
        const SCRIPT_URL = "PASTE_YOUR_NEW_URL_HERE";
        const me = localStorage.getItem('playerName');
        document.getElementById('p-name').innerText = me;

        async function loadData() {
            const res = await fetch(SCRIPT_URL);
            const json = await res.json();
            
            // FIX: Point to json.standings
            document.getElementById('table-body').innerHTML = json.standings.map((p, i) => `
                <tr class="border-t border-white/5 ${p[0]===me?'bg-blue-500/10 text-white font-bold':''}">
                    <td class="py-3">${i+1}</td><td class="py-3">${p[0]}</td><td class="py-3 text-right text-blue-400">${p[9]} PTS</td>
                </tr>
            `).join('');

            // FIX: Point to json.fixtures
            document.getElementById('fix-list').innerHTML = json.fixtures.map(f => `
                <div class="bg-white/5 p-4 rounded-xl flex justify-between">
                    <span>${f[1]} <b class="text-slate-600 mx-2">VS</b> ${f[2]}</span>
                    <span class="text-blue-500 font-bold uppercase text-[10px]">${f[3]}</span>
                </div>
            `).join('');
        }
        loadData();
    </script>
</body>
</html>
