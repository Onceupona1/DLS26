<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 | Player Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") { window.location.href = "login.html"; }
    </script>
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .fixture-card { border-left: 4px solid #3b82f6; transition: transform 0.2s; }
        .fixture-card:hover { transform: translateX(5px); }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen pb-20">

    <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-tighter text-white uppercase">DLS<span class="text-blue-500">26</span> PRO</h1>
        <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-xs bg-red-500/10 text-red-500 px-4 py-2 rounded-full font-bold hover:bg-red-500 hover:text-white transition">LOGOUT</button>
    </nav>

    <main class="max-w-4xl mx-auto px-6 space-y-8">
        
        <div class="glass-card p-8 rounded-[2rem] flex justify-between items-center border border-white/5">
            <div>
                <h2 class="text-slate-500 text-[10px] uppercase tracking-widest font-black mb-1">Authenticated Player</h2>
                <p id="nav-player-name" class="text-3xl font-black text-white italic"></p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-blue-500 font-black uppercase tracking-widest">Current Rank</p>
                <p id="my-rank" class="text-3xl font-black text-white">--</p>
            </div>
        </div>

        <section class="space-y-4">
            <h2 class="text-sm font-black text-white uppercase tracking-widest px-2">Upcoming Fixtures</h2>
            <div id="fixtures-container" class="grid grid-cols-1 gap-3">
                <div class="glass-card p-6 rounded-2xl animate-pulse text-slate-600">Loading your next match...</div>
            </div>
        </section>

        <section class="bg-blue-600 p-8 rounded-[2.5rem] shadow-2xl shadow-blue-900/30">
            <h2 class="text-xl font-black text-white mb-6 uppercase italic tracking-tighter">Submit Match Score</h2>
            <form id="result-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="opp-name" placeholder="Opponent Name" required class="bg-slate-900/40 p-4 rounded-2xl outline-none border border-white/10 text-white placeholder:text-slate-400">
                <input type="text" id="ss-link" placeholder="Screenshot URL (e.g. Imgur)" required class="bg-slate-900/40 p-4 rounded-2xl outline-none border border-white/10 text-white placeholder:text-slate-400">
                <div class="flex gap-3">
                    <input type="number" id="my-score" placeholder="Your Score" required class="w-1/2 bg-slate-900/40 p-4 rounded-2xl text-center border border-white/10 font-bold">
                    <input type="number" id="opp-score" placeholder="Opp Score" required class="w-1/2 bg-slate-900/40 p-4 rounded-2xl text-center border border-white/10 font-bold">
                </div>
                <button type="submit" id="submit-btn" class="bg-white text-blue-600 font-black rounded-2xl py-4 hover:bg-slate-100 transition shadow-lg">SUBMIT TO ADMIN</button>
            </form>
        </section>

        <section class="glass-card rounded-[2.5rem] p-6 border border-white/5">
            <h3 class="font-bold text-white mb-4 px-2">League Standings</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <tbody id="league-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec";
        const me = localStorage.getItem('playerName');
        document.getElementById('nav-player-name').innerText = me;

        async function initDashboard() {
            try {
                const res = await fetch(SCRIPT_URL);
                const json = await res.json();
                
                // 1. Handle Standings
                const standings = json.standings;
                const tableBody = document.getElementById('league-table-body');
                tableBody.innerHTML = standings.map((p, i) => {
                    const isMe = (p[0] === me);
                    if(isMe) document.getElementById('my-rank').innerText = `#${i+1}`;
                    return `
                        <tr class="border-t border-white/5 ${isMe ? 'bg-blue-500/10' : ''}">
                            <td class="p-4 font-mono text-slate-500">${i+1}</td>
                            <td class="p-4 font-bold text-white">${p[0]} ${isMe ? '⭐' : ''}</td>
                            <td class="p-4 text-right font-black text-blue-400">${p[9] || 0} PTS</td>
                        </tr>
                    `;
                }).join('');

                // 2. Handle Fixtures
                const fixtures = json.fixtures;
                const fixturesContainer = document.getElementById('fixtures-container');
                if (!fixtures || fixtures.length === 0) {
                    fixturesContainer.innerHTML = '<div class="text-slate-600 text-sm p-4 italic">No fixtures scheduled yet.</div>';
                } else {
                    fixturesContainer.innerHTML = fixtures.map(f => `
                        <div class="glass-card p-5 rounded-2xl flex justify-between items-center fixture-card">
                            <div class="text-sm font-bold text-white">
                                <span class="${f[1] === me ? 'text-blue-400 underline' : ''}">${f[1]}</span> 
                                <span class="text-slate-600 mx-3 text-[10px] italic font-normal">VS</span> 
                                <span class="${f[2] === me ? 'text-blue-400 underline' : ''}">${f[2]}</span>
                            </div>
                            <div class="text-[9px] bg-slate-800 border border-white/5 px-3 py-1.5 rounded-full text-blue-400 font-black uppercase tracking-tighter">${f[3]}</div>
                        </div>
                    `).join('');
                }

            } catch (e) { console.error("Sync Error:", e); }
        }

        document.getElementById('result-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "SENDING..."; btn.disabled = true;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "submitResult",
                        playerName: me,
                        opponent: document.getElementById('opp-name').value,
                        myScore: document.getElementById('my-score').value,
                        oppScore: document.getElementById('opp-score').value,
                        ssLink: document.getElementById('ss-link').value
                    })
                });
                alert("Score Sent! Admin will verify your screenshot soon.");
                document.getElementById('result-form').reset();
            } catch(err) { alert("Error sending result."); }
            btn.innerText = "SUBMIT TO ADMIN"; btn.disabled = false;
        };

        initDashboard();
    </script>
</body>
</html>
