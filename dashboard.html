<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") { window.location.href = "login.html"; }
    </script>
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen pb-20">

    <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-tighter text-white">DLS<span class="text-blue-500">26</span> DASHBOARD</h1>
        <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-xs bg-red-500/10 text-red-500 px-4 py-2 rounded-full font-bold">LOGOUT</button>
    </nav>

    <main class="max-w-4xl mx-auto px-6 space-y-8">
        <div class="glass-card p-8 rounded-[2rem] border-l-4 border-blue-500">
            <h2 class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Welcome Back</h2>
            <p id="nav-player-name" class="text-3xl font-black text-white"></p>
        </div>

        <section class="bg-blue-600 p-8 rounded-[2rem] shadow-xl shadow-blue-900/20">
            <h2 class="text-xl font-black text-white mb-4">Submit Match Result</h2>
            <form id="result-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="opp-name" placeholder="Opponent Name" required class="bg-slate-900/50 p-4 rounded-xl outline-none text-white border border-blue-400/30">
                <input type="text" id="ss-link" placeholder="Screenshot Link" required class="bg-slate-900/50 p-4 rounded-xl outline-none text-white border border-blue-400/30">
                <div class="flex gap-2">
                    <input type="number" id="my-score" placeholder="My Score" required class="w-1/2 bg-slate-900/50 p-4 rounded-xl text-center border border-blue-400/30">
                    <input type="number" id="opp-score" placeholder="Opp Score" required class="w-1/2 bg-slate-900/50 p-4 rounded-xl text-center border border-blue-400/30">
                </div>
                <button type="submit" id="submit-btn" class="bg-white text-blue-600 font-black rounded-xl py-4 hover:bg-slate-100 transition">SUBMIT TO ADMIN</button>
            </form>
        </section>

        <section class="glass-card rounded-[2rem] p-6 overflow-hidden">
            <h3 class="font-bold text-white mb-4">Current Standings</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="text-slate-500 font-bold border-b border-white/5">
                            <th class="p-3">Pos</th><th class="p-3">Player</th><th class="p-3">P</th><th class="p-3">GD</th><th class="p-3 text-blue-400">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="league-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec";
        document.getElementById('nav-player-name').innerText = localStorage.getItem('playerName');

        async function loadTable() {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            const me = localStorage.getItem('playerName');
            document.getElementById('league-table-body').innerHTML = data.map((p, i) => `
                <tr class="border-t border-white/5 ${p[0] === me ? 'bg-blue-500/10' : ''}">
                    <td class="p-3 font-mono">${i+1}</td>
                    <td class="p-3 font-bold text-white">${p[0]} ${p[0] === me ? '⭐' : ''}</td>
                    <td class="p-3">${p[4] || 0}</td><td class="p-3">${p[8] || 0}</td>
                    <td class="p-3 font-bold text-blue-400">${p[9] || 0}</td>
                </tr>
            `).join('');
        }
        
        document.getElementById('result-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Sending..."; btn.disabled = true;
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "submitResult",
                    playerName: localStorage.getItem('playerName'),
                    opponent: document.getElementById('opp-name').value,
                    myScore: document.getElementById('my-score').value,
                    oppScore: document.getElementById('opp-score').value,
                    ssLink: document.getElementById('ss-link').value
                })
            });
            alert("Sent! Admin will verify soon.");
            btn.innerText = "SUBMIT TO ADMIN"; btn.disabled = false;
        };
        loadTable();
    </script>
</body>
</html>
