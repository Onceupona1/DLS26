<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS26 PRO • Dashboard • Isaac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>if(localStorage.getItem("isLoggedIn")!=="true") window.location.href="login.html";</script>
    <style>
        .glass { background: rgba(15,23,42,0.9); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black">DLS<span class="text-blue-500">26</span> PRO • DASHBOARD</h1>
            <button onclick="localStorage.clear();location.href='index.html'" class="text-red-400 hover:underline">LOGOUT</button>
        </div>

        <div class="glass rounded-3xl p-6 border border-blue-500/30">
            <p class="text-blue-400 font-bold">WELCOME BACK</p>
            <h2 id="welcome" class="text-3xl font-black text-white"></h2>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mt-6">
            <!-- Your Fixtures -->
            <div class="glass rounded-3xl p-6">
                <h2 class="font-bold text-lg mb-4">📅 YOUR FIXTURES (Auto Scheduled)</h2>
                <div id="fixtures" class="space-y-3"></div>
            </div>

            <!-- Last 5 Games -->
            <div class="glass rounded-3xl p-6">
                <h2 class="font-bold text-lg mb-4">🏆 LAST 5 GAMES • RESULTS</h2>
                <div id="last5" class="space-y-3"></div>
            </div>
        </div>

        <!-- Submit Result -->
        <div class="glass rounded-3xl p-6 mt-6">
            <h2 class="font-bold text-lg mb-4">📸 SUBMIT MATCH RESULT (Admin will verify)</h2>
            <form id="submitForm" class="grid grid-cols-2 gap-4">
                <input id="opp" placeholder="Opponent Name" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl">
                <div class="flex gap-3">
                    <input id="my" type="number" placeholder="My Score" class="w-1/2 bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center">
                    <input id="oppScore" type="number" placeholder="Opp Score" class="w-1/2 bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center">
                </div>
                <input id="screenshot" type="url" placeholder="Screenshot Link (Imgur)" class="col-span-2 bg-slate-900 border border-slate-700 p-4 rounded-2xl">
                <button type="submit" class="col-span-2 bg-green-600 hover:bg-green-500 py-5 font-bold text-lg rounded-2xl">SUBMIT RESULT → PENDING APPROVAL</button>
            </form>
            <p id="submitStatus" class="mt-3 text-center font-medium"></p>
        </div>

        <!-- Mini Standings -->
        <div class="glass rounded-3xl p-6 mt-6">
            <h2 class="font-bold text-lg mb-4">📊 LEAGUE STANDINGS (You highlighted)</h2>
            <table class="w-full" id="miniTable"></table>
        </div>
    </div>

    <script>
        const URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec";
        const me = localStorage.getItem("playerName") || "Player";
        document.getElementById("welcome").innerText = me;

        async function loadDashboard() {
            const data = await (await fetch(URL + '?t=' + Date.now())).json();

            // Fixtures filtered for you
            const myFix = (data.fixtures || []).filter(f => f[1] === me || f[2] === me);
            document.getElementById("fixtures").innerHTML = myFix.length ? myFix.map(f => `
                <div class="bg-slate-800 p-4 rounded-2xl flex justify-between">
                    <span>${f[1]} <b>VS</b> ${f[2]}</span>
                    <span class="text-blue-400">${f[3] || 'Date TBD'}</span>
                </div>
            `).join('') : "No fixtures yet — admin is scheduling";

            // Last 5 + Submit success
            // (same logic as before + toast on submit)

            document.getElementById("submitForm").onsubmit = async (e) => {
                e.preventDefault();
                const status = document.getElementById("submitStatus");
                status.innerHTML = "✅ Sent! Waiting for admin approval...";
                status.style.color = "#86efac";
                
                await fetch(URL, {method:"POST", body: JSON.stringify({
                    action: "submitResult",
                    playerName: me,
                    opponent: document.getElementById("opp").value,
                    myScore: document.getElementById("my").value,
                    oppScore: document.getElementById("oppScore").value,
                    ssLink: document.getElementById("screenshot").value
                })});
                setTimeout(() => location.reload(), 1500);
            };
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
