<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") { window.location.href = "login.html"; }
    </script>
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .fixture-row { border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen pb-20">

    <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-tighter text-white">DLS<span class="text-blue-500">26</span> DASHBOARD</h1>
        <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-xs bg-red-500/10 text-red-500 px-4 py-2 rounded-full font-bold">LOGOUT</button>
    </nav>

    <main class="max-w-4xl mx-auto px-6 space-y-8">
        
        <div class="glass-card p-8 rounded-[2rem] flex justify-between items-center">
            <div>
                <h2 class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Welcome Back</h2>
                <p id="nav-player-name" class="text-3xl font-black text-white"></p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-blue-400 font-bold uppercase">Your Rank</p>
                <p id="my-rank" class="text-2xl font-black text-white">--</p>
            </div>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-white px-2">Upcoming Fixtures</h2>
            <div id="fixtures-container" class="grid grid-cols-1 gap-3">
                <div class="glass-card p-4 rounded-2xl animate-pulse text-slate-600 italic">Syncing fixtures...</div>
            </div>
        </section>

        <section class="bg-blue-600 p-8 rounded-[2rem] shadow-xl">
            <h2 class="text-xl font-black text-white mb-4 italic uppercase">Submit Score</h2>
            <form id="result-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="opp-name" placeholder="Opponent Name" required class="bg-slate-900/50 p-4 rounded-xl outline-none border border-blue-400/30">
                <input type="text" id="ss-link" placeholder="Screenshot Link" required class="bg-slate-900/50 p-4 rounded-xl outline-none border border-blue-400/30">
                <div class="flex gap-2">
                    <input type="number" id="my-score" placeholder="You" required class="w-1/2 bg-slate-900/50 p-4 rounded-xl text-center border border-blue-400/30">
                    <input type="number" id="opp-score" placeholder="Opp" required class="w-1/2 bg-slate-900/50 p-4 rounded-xl text-center border border-blue-400/30">
                </div>
                <button type="submit" id="submit-btn" class="bg-white text-blue-600 font-black rounded-xl py-4 hover:scale-[1.02] transition">SEND TO ADMIN</button>
            </form>
        </section>

        <section class="glass-card rounded-[2rem] p-6 overflow-hidden">
            <h3 class="font-bold text-white mb-4">League Standings</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <tbody id="league-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec";
        const me = localStorage.getItem('playerName');
        document.getElementById('nav-player-name').innerText = me;

        async function initDashboard() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                // 1. Load Table & Find Rank
                const tableBody = document.getElementById('league-table-body');
                tableBody.innerHTML = data.map((p, i) => {
                    if(p[0] === me) document.getElementById('my-rank').innerText = `#${i+1}`;
                    return `
                        <tr class="border-t border-white/5 ${p[0] === me ? 'bg-blue-500/10' : ''}">
                            <td class="p-3 font-mono text-slate-500">${i+1}</td>
                            <td class="p-3 font-bold text-white">${p[0]}</td>
                            <td class="p-3 text-right font-black text-blue-400">${p[9] || 0} PTS</td>
                        </tr>
                    `;
                }).join('');

                // 2. Load Fixtures (Mocked for now, will connect to sheet next)
                const fixturesContainer = document.getElementById('fixtures-container');
                // For now, we will show a placeholder. 
                // Once you add the 'Fixtures' sheet, I will give you the Script update to pull real data.
                fixturesContainer.innerHTML = `
                    <div class="glass-card p-4 rounded-2xl flex justify-between items-center fixture-row">
                        <div class="text-sm font-bold text-white">${me} <span class="text-slate-500 mx-2">VS</span> Opponent</div>
                        <div class="text-[10px] bg-slate-800 px-2 py-1 rounded text-blue-400 font-bold uppercase tracking-tighter">Gameweek 1</div>
                    </div>
                `;

            } catch (e) { console.error(e); }
        }

        document.getElementById('result-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "SENDING..."; btn.disabled = true;
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "submitResult",
                    playerName: me,
                    opponent: document.getElementById('opp-name').value,
                    myScore: document.getElementById('my-score').value,
                    oppScore: document.getElementById('opp-score').value,
                    ssLink: document.getElementById('ss-link').value
                })
            });
            alert("Score Submitted!");
            btn.innerText = "SEND TO ADMIN"; btn.disabled = false;
            document.getElementById('result-form').reset();
        };

        initDashboard();
    </script>
</body>
</html>
