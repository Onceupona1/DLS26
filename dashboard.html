<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 26 | EPL League Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Security check
        if (localStorage.getItem("isLoggedIn") !== "true") { window.location.href = "login.html"; }
    </script>
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { border-bottom: 2px solid #3b82f6; color: white; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen pb-20">

    <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-tighter text-white">DLS<span class="text-blue-500">26</span> PRO</h1>
        <div class="flex items-center gap-4">
            <span id="nav-player-name" class="text-sm font-medium text-slate-400"></span>
            <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-xs bg-red-500/10 text-red-500 px-3 py-1 rounded-full hover:bg-red-500 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 space-y-10">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Your Status</p>
                <p id="dash-status" class="text-xl font-bold text-white">Loading...</p>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Current Matchday</p>
                <p class="text-xl font-bold text-blue-400">Gameweek 1</p>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Tournament Type</p>
                <p class="text-xl font-bold text-white">EPL Style League</p>
            </div>
        </div>

        <section class="glass-card rounded-[2rem] overflow-hidden">
            <div class="p-6 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <h2 class="font-bold text-lg text-white">League Standings</h2>
                <span class="text-[10px] bg-blue-600 px-2 py-1 rounded text-white font-bold uppercase">Live</span>
            </div>
            <div class="overflow-x-auto p-4">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="text-slate-500 font-bold">
                            <th class="p-3">Pos</th>
                            <th class="p-3">Player</th>
                            <th class="p-3">P</th>
                            <th class="p-3">W</th>
                            <th class="p-3">D</th>
                            <th class="p-3">L</th>
                            <th class="p-3">GD</th>
                            <th class="p-3 text-blue-400">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="league-table-body">
                        <tr><td colspan="8" class="text-center py-10 text-slate-600 italic">Connecting to League Database...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="bg-blue-600/10 border border-blue-500/20 rounded-[2rem] p-8">
            <div class="max-w-xl mx-auto text-center mb-8">
                <h2 class="text-2xl font-bold text-white">Submit Match Result</h2>
                <p class="text-slate-400 text-sm">Submit your scores and screenshot for admin verification.</p>
            </div>

            <form id="result-form" class="max-w-2xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="opp-name" placeholder="Opponent Name" required class="w-full bg-slate-950 p-4 rounded-2xl border border-slate-800 outline-none focus:border-blue-500 text-white">
                <input type="text" id="ss-link" placeholder="Screenshot Link (e.g. Imgur)" required class="w-full bg-slate-950 p-4 rounded-2xl border border-slate-800 outline-none focus:border-blue-500 text-white">
                <div class="flex gap-2">
                    <input type="number" id="my-score" placeholder="Your Score" required class="w-1/2 bg-slate-950 p-4 rounded-2xl border border-slate-800 outline-none focus:border-blue-500 text-white text-center">
                    <input type="number" id="opp-score" placeholder="Opponent Score" required class="w-1/2 bg-slate-950 p-4 rounded-2xl border border-slate-800 outline-none focus:border-blue-500 text-white text-center">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl transition-all shadow-lg shadow-blue-900/30">Submit Result</button>
            </form>
        </section>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHtvLu74wApqPjqoNAp13cCTaFIhmnM5wzvOiwL0-Fwq3Jxm18xa5mWrLLeDJDFujF/exec"; // Use the same one as login
        
        // 1. Initial Page Load
        document.getElementById('nav-player-name').innerText = localStorage.getItem('playerName');
        document.getElementById('dash-status').innerText = localStorage.getItem('playerStatus');

        // 2. Fetch League Table Data
        async function loadTable() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                const tbody = document.getElementById('league-table-body');
                tbody.innerHTML = ""; // Clear loader

                data.forEach((player, index) => {
                    const row = `
                        <tr class="border-t border-white/5 hover:bg-white/5 transition">
                            <td class="p-3 font-bold">${index + 1}</td>
                            <td class="p-3 font-bold text-white">${player[0]}</td>
                            <td class="p-3">0</td><td class="p-3">0</td><td class="p-3">0</td><td class="p-3">0</td><td class="p-3">0</td>
                            <td class="p-3 font-bold text-blue-400">0</td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) { console.error("Table Error:", err); }
        }
        loadTable();

        // 3. Handle Score Submission
        document.getElementById('result-form').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "Submitting...";

            const payload = {
                action: "submitResult", // We tell the script what we are doing
                playerName: localStorage.getItem('playerName'),
                playerRef: localStorage.getItem('playerRef'),
                opponent: document.getElementById('opp-name').value,
                myScore: document.getElementById('my-score').value,
                oppScore: document.getElementById('opp-score').value,
                ssLink: document.getElementById('ss-link').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert("Result submitted! Verification takes 1-2 hours.");
                document.getElementById('result-form').reset();
            } catch (err) {
                alert("Submission failed. Error: " + err.message);
            } finally {
                btn.disabled = false; btn.innerText = "Submit Result";
            }
        };
    </script>
</body>
</html>
